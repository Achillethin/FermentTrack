[project]
name = "fermenttrack"
version = "0.1.0"
description = "Batch journal and smart reminders for serious fermenters"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Achille Thin", email = "achille.thin@free.fr" }
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
    "stripe>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]
# "graph" extra intentionally removed 2026-09-17: fermentgraph's suggestion/analog
# API doesn't exist and its ranker doesn't beat baseline. See docs/DEPENDENCIES.md.
# Re-add once that doc's trigger condition fires.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fermenttrack"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
